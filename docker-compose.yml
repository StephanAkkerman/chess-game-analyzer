# Deploy with: cp .env.example .env, edit it, then `docker compose up -d`.
# See README.md ("Self-hosting") for details.
services:
  app:
    image: ghcr.io/stephanakkerman/chess-game-analyzer:latest
    build:
      context: .
      args:
        # Endgame tablebases baked into the image: full, wdl or none.
        SYZYGY: ${SYZYGY:-full}
    restart: unless-stopped
    environment:
      ACCESS_CODE: ${ACCESS_CODE:-}
      ANALYSIS_DEPTH: ${ANALYSIS_DEPTH:-16}
      ANALYSIS_MAX_TIME: ${ANALYSIS_MAX_TIME:-15}
      ANALYSIS_TIME: ${ANALYSIS_TIME:-}
      STOCKFISH_THREADS: ${STOCKFISH_THREADS:-}
      STOCKFISH_HASH: ${STOCKFISH_HASH:-128}
      ENGINE_NICE: ${ENGINE_NICE:-10}
      WORKERS: ${WORKERS:-1}
      MAX_QUEUE: ${MAX_QUEUE:-20}
      OPENING_EXPLORER: ${OPENING_EXPLORER:-lichess}
      LICHESS_TOKEN: ${LICHESS_TOKEN:-}
      COACH_URL: ${COACH_URL:-}
      COACH_MODEL: ${COACH_MODEL:-}
      COACH_API_KEY: ${COACH_API_KEY:-}
      COACH_TIMEOUT: ${COACH_TIMEOUT:-60}
    volumes:
      - analyzer-data:/data
      # The image includes an opening book and the endgame tablebases. To use
      # your own Polyglot book instead, mount it over the built-in one:
      # - ./my-book.bin:/opt/books/book.bin:ro
    # Only reachable through Caddy or the tunnel. For a quick LAN test,
    # uncomment this and open http://<pi-ip>:8000.
    # ports:
    #   - "8000:8000"

  # HTTPS with automatic Let's Encrypt certificates. Needs ports 80 and 443
  # forwarded from your router to the Pi, and a DNS A/AAAA record for DOMAIN.
  caddy:
    image: caddy:2
    profiles: ["caddy"]
    restart: unless-stopped
    depends_on:
      - app
    environment:
      DOMAIN: ${DOMAIN:-chess.akkerman.ai}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  # Alternative to Caddy: a Cloudflare Tunnel needs no port forwarding and
  # hides your home IP. infra/ (Terraform) creates the tunnel, which routes
  # its public hostname to http://app:8000, and outputs the token.
  cloudflared:
    image: cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    depends_on:
      - app
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}

  # Optional language model that rewords move explanations like a coach.
  # Add "coach" to COMPOSE_PROFILES, set COACH_URL=http://ollama:11434/v1 and
  # COACH_MODEL=qwen2.5:1.5b, then download the model once with
  # `docker compose exec ollama ollama pull qwen2.5:1.5b`.
  ollama:
    image: ollama/ollama:latest
    profiles: ["coach"]
    restart: unless-stopped
    environment:
      # Keep the model loaded, and generate one answer at a time.
      OLLAMA_KEEP_ALIVE: 24h
      OLLAMA_NUM_PARALLEL: 1
    volumes:
      - ollama-models:/root/.ollama

volumes:
  analyzer-data:
  ollama-models:
  caddy-data:
  caddy-config:
