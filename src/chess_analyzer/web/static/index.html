<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Analyse your Chess.com and Lichess games with Stockfish and opening theory.">
  <meta name="theme-color" content="#f6f5f1" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1b1a18" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Chess Analyzer">
  <title>Chess Analyzer</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/icon.svg">
  <link rel="stylesheet" href="/static/app.css">
  <script type="module" src="/static/app.js"></script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#/">
      <img src="/static/icon.svg" alt="" width="28" height="28">
      <span>Chess Analyzer</span>
    </a>
  </header>

  <main id="view" aria-live="polite"></main>

  <dialog id="access-dialog">
    <form method="dialog" id="access-form">
      <h2>Access code</h2>
      <p class="muted">This analyzer is private. Enter the access code you were given.</p>
      <input id="access-input" type="password" autocomplete="current-password" required>
      <p class="error" id="access-error" hidden></p>
      <div class="row end">
        <button type="submit" class="primary">Continue</button>
      </div>
    </form>
  </dialog>

  <template id="home-template">
    <section class="card">
      <h1>Analyse your games</h1>
      <form id="user-form" class="stack">
        <label for="username">Username</label>
        <div class="row">
          <select id="site" aria-label="Site">
            <option value="chess.com">Chess.com</option>
            <option value="lichess">Lichess</option>
          </select>
          <input id="username" name="username" autocomplete="username" autocapitalize="off"
                 spellcheck="false" placeholder="e.g. hikaru" required>
          <button type="submit" class="primary">Show games</button>
        </div>
        <label class="row small muted" for="months">
          Games from the last
          <select id="months">
            <option value="1">month</option>
            <option value="3">3 months</option>
            <option value="6">6 months</option>
          </select>
        </label>
      </form>
    </section>

    <section id="progress" class="card" hidden>
      <h2>Your progress</h2>
      <p class="muted small" id="progress-status"></p>
      <div id="progress-body" hidden>
        <svg id="trend" class="graph trend" role="img" aria-label="Average centipawn loss per game"></svg>
        <p class="muted small" id="trend-caption"></p>
        <ul id="insights" class="insights"></ul>
        <div id="progress-details" class="progress-details"></div>
      </div>
    </section>

    <section id="peers" class="card" hidden>
      <h2>Compared with your peers</h2>
      <p class="muted small" id="peers-status"></p>
      <div class="row">
        <select id="peers-tc" aria-label="Time control"></select>
        <select id="peers-offset" aria-label="Compare with">
          <option value="0">players at your rating</option>
          <option value="200">players 200 points higher</option>
        </select>
        <button type="button" id="peers-find">Find players</button>
      </div>
      <div id="peers-body" hidden>
        <div id="peers-table"></div>
        <ul id="peers-insights" class="insights"></ul>
        <p class="muted small" id="peers-analyse-note"></p>
        <div class="row end" id="peers-analyse-row" hidden>
          <button type="button" id="peers-analyse"></button>
        </div>
        <div id="peers-batch" class="batch" hidden>
          <p class="small" id="peers-batch-status"></p>
          <div class="progress" role="progressbar" aria-label="Peer analysis progress" aria-valuemin="0" aria-valuemax="100">
            <div class="progress-fill" id="peers-batch-fill"></div>
          </div>
        </div>
      </div>
    </section>

    <section id="games" class="card" hidden>
      <h2 id="games-title">Recent games</h2>
      <p class="muted small" id="games-status"></p>
      <div class="row end" id="analyse-all-row" hidden>
        <button type="button" id="analyse-all">Analyse the 10 most recent</button>
      </div>
      <div id="batch" class="batch" hidden>
        <p class="small" id="batch-status"></p>
        <div class="progress" role="progressbar" aria-label="Analysis progress" aria-valuemin="0" aria-valuemax="100">
          <div class="progress-fill" id="batch-fill"></div>
        </div>
      </div>
      <ul id="game-list" class="game-list"></ul>
    </section>

    <section id="recent" class="card" hidden>
      <h2>Recently analysed</h2>
      <ul id="recent-list" class="link-list"></ul>
    </section>

    <section class="card">
      <details>
        <summary>Paste a PGN instead</summary>
        <form id="pgn-form" class="stack">
          <textarea id="pgn" rows="6" placeholder="[Event &quot;...&quot;]&#10;1. e4 e5 2. Nf3 ..." required></textarea>
          <p class="error" id="pgn-error" hidden></p>
          <div class="row end"><button type="submit" class="primary">Analyse</button></div>
        </form>
      </details>
    </section>

    <p class="muted small center" id="engine-info"></p>
  </template>

  <template id="analysis-template">
    <section id="pending" class="card" hidden>
      <h1 id="pending-title">Analysing…</h1>
      <p class="muted" id="pending-status"></p>
      <div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
    </section>

    <section id="failed" class="card" hidden>
      <h1>Analysis failed</h1>
      <p class="error" id="failed-error"></p>
      <a href="#/" class="button">Back</a>
    </section>

    <div id="analysis" class="analysis" hidden>
      <div class="board-column">
        <div class="player" id="player-top"></div>
        <div class="board-wrap">
          <div class="evalbar" id="evalbar" aria-hidden="true"><div class="evalbar-white" id="evalbar-white"></div><span class="evalbar-label" id="evalbar-label"></span></div>
          <div class="board" id="board" role="img"></div>
        </div>
        <div class="player" id="player-bottom"></div>
        <div class="controls">
          <button type="button" data-nav="start" aria-label="First move">⏮</button>
          <button type="button" data-nav="prev" aria-label="Previous move">◀</button>
          <button type="button" data-nav="next" aria-label="Next move">▶</button>
          <button type="button" data-nav="end" aria-label="Last move">⏭</button>
          <button type="button" id="flip" aria-label="Flip board">⇅</button>
          <button type="button" id="share" aria-label="Share analysis">Share</button>
        </div>
      </div>

      <div class="side-column">
        <section class="card move-info" id="move-info"></section>

        <section class="card">
          <h2>Evaluation</h2>
          <svg id="graph" class="graph" role="img" aria-label="Evaluation over the game"></svg>
        </section>

        <section class="card">
          <h2>Moves</h2>
          <ol id="moves" class="moves"></ol>
        </section>

        <section class="card">
          <h2>Summary</h2>
          <div id="summary" class="summary"></div>
        </section>

        <section class="card">
          <h2>Opening</h2>
          <div id="opening"></div>
        </section>

        <p class="muted small center" id="game-meta"></p>
      </div>
    </div>
  </template>
</body>
</html>
